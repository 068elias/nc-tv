<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NC TV Player</title>
<style>
    /* Bildschirm eines Fernsehers. Läuft als eigene Seite (z. B. auf GitHub Pages), damit YouTube die Einbettung erlaubt. */
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    #ytwrap, #ytwrap iframe, #vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
    #vid { object-fit: contain; background: #000; display: none; }
    /* Nummer des Fernsehers, damit man ihn im Tablet findet */
    #num { position: absolute; left: 26px; top: 22px; z-index: 6; display: none; padding: 6px 16px 7px; border-radius: 12px;
        color: #fff; font: 700 30px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; background: rgba(0, 0, 0, .55);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .18); }
    #num small { font-size: 18px; font-weight: 600; opacity: .7; margin-right: 6px; }
    /* Titel blendet beim Umschalten kurz ein */
    #title { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 60px 40px 30px; color: #fff;
        font: 600 34px 'Segoe UI', Arial, sans-serif; text-shadow: 0 2px 8px #000;
        background: linear-gradient(transparent, rgba(0, 0, 0, .75)); opacity: 0; transition: opacity .6s; }
    #title.on { opacity: 1; }
    #dot { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border: 4px solid #ff2fb0; border-radius: 50%;
        display: none; pointer-events: none; z-index: 7; }
    #dot span { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: #fff;
        font: 600 24px 'Segoe UI', sans-serif; text-shadow: 0 0 4px #000, 0 0 8px #000; }
    #msg { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center;
        text-align: center; padding: 0 60px; color: #fff; font: 600 40px 'Segoe UI', sans-serif;
        background: radial-gradient(circle at 50% 40%, #2a1240, #07020e 70%); }
    #msg i { width: 54px; height: 54px; border-radius: 50%; border: 6px solid rgba(255, 255, 255, .15); border-top-color: #ff2fb0; animation: spin 1s linear infinite; }
    #msg.err i { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="ytwrap"><div id="yt"></div></div>
<video id="vid" playsinline></video>
<div id="num"><small>TV</small><b id="numv"></b></div>
<div id="title"></div>
<div id="dot"><span id="dotlbl"></span></div>
<div id="msg"><i></i><span id="msgt">Lädt …</span></div>
<script>
    // player.js mit demselben Versions-Parameter laden wie die Seite, damit kein alter Zwischenspeicher greift
    (function () {
        var v = new URLSearchParams(location.search).get('v') || '';
        var s = document.createElement('script');
        s.src = 'player.js' + (v ? '?v=' + encodeURIComponent(v) : '');
        document.body.appendChild(s);
    })();
</script>
</body>
</html>
